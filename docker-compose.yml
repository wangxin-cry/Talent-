name: talentmatch

services:
  # ---------------- PostgreSQL ----------------
  postgres:
    image: postgres:16-alpine
    container_name: talentmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentmatch}
      POSTGRES_DB: ${POSTGRES_DB:-talentmatch}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentmatch} -d ${POSTGRES_DB:-talentmatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- MinIO 对象存储 ----------------
  minio:
    image: minio/minio:latest
    container_name: talentmatch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-talentmatch}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-talentmatch123}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # 控制台
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- 初始化桶（一次性任务） ----------------
  minio-init:
    image: minio/mc:latest
    container_name: talentmatch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-talentmatch}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-talentmatch123}
      MINIO_BUCKET: ${MINIO_BUCKET:-talentmatch-resume}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\" &&
      mc anonymous set none local/\"$$MINIO_BUCKET\" &&
      echo '[minio-init] bucket ready: '\"$$MINIO_BUCKET\"
      "
    restart: "no"

# 说明：
#   1) 后端与前端在开发期用本机进程跑（uvicorn / vite），不放进 compose，
#      这样改代码即时生效；需要全容器化时再加 api / web 服务。
#   2) 数据卷落在 ./data 下，已在 .gitignore 中忽略，不会误提交。
#   3) 桶初始化为 private，符合"桶不公开、下载走预签名 URL"的设计。
